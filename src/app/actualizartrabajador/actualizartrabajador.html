<div class="card">
  <h2>Actualizar {{ tipo }}</h2>

  <form (ngSubmit)="guardar()">
    <div class="group">
      <label>Nombre completo</label>
      <input type="text" [(ngModel)]="modelo.nombre" name="nombre" required>
    </div>

    <div class="group">
      <label>Cédula</label>
      <input type="text" [(ngModel)]="modelo.cedula" name="cedula" required>
    </div>

    <div class="group">
      <label>Correo electrónico</label>
      <input type="email" [(ngModel)]="modelo.correo" name="correo" required>
    </div>

    <div class="group">
      <label>Teléfono</label>
      <input type="text" [(ngModel)]="modelo.telefono" name="telefono">
    </div>

    <div class="group">
      <label>Turno</label>
      <select [(ngModel)]="modelo.turno" name="turno">
        <option value="Mañana">Mañana</option>
        <option value="Tarde">Tarde</option>
        <option value="Noche">Noche</option>
      </select>
    </div>

    <div *ngIf="tipo === 'Conductor'" class="group">
      <label>Placa del Vehículo</label>
      <input type="text" [(ngModel)]="modelo.placaVehiculo" name="placa">
    </div>

    <div *ngIf="tipo === 'Manipulador'" class="group">
      <label>Tipo de Manipulador</label>
      <input type="text" [(ngModel)]="modelo.tipoManipulador" name="tipoM">
    </div>

    <div *ngIf="tipo === 'Administrador'">
      <div class="group">
        <label>Nombre de Usuario</label>
        <input type="text" [(ngModel)]="modelo.usuario" name="user">
      </div>
      <div class="group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="modelo.contrasenia" name="pass">
      </div>
    </div>

    <div class="buttons" style="margin-top: 20px;">
      <button type="submit" class="btn-save" [disabled]="cargando">
        {{ cargando ? 'Guardando...' : 'Guardar Cambios' }}
      </button>
      <button type="button" class="btn-cancel" (click)="exito()">
        Cancelar
      </button>
    </div>
  </form>
</div>
