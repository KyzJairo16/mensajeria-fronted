<div class="registro-wrapper animate__animated animate__fadeIn">
  <div class="registro-card">

    <div class="form-header">
      <h2>Actualizar Trabajador</h2>
      <p>Rol: {{ tipo }}</p>
    </div>

    <form (ngSubmit)="guardar()">
      <input type="hidden" [(ngModel)]="modelo.correo" name="correo">
      <input type="hidden" [(ngModel)]="modelo.telefono" name="telefono">
      <input *ngIf="tipo === 'Administrador'" type="hidden" [(ngModel)]="modelo.usuario" name="usuario">
      <input *ngIf="tipo === 'Administrador'" type="hidden" [(ngModel)]="modelo.contrasenia" name="contrasenia">

      <div class="input-group">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="modelo.nombre" name="nombre" required>
      </div>

      <div class="input-group">
        <label>Cédula</label>
        <input type="text" [(ngModel)]="modelo.cedula" name="cedula" required>
      </div>

      <div class="input-group">
        <label>Turno</label>
        <select class="combo-box" [(ngModel)]="modelo.turno" name="turno">
          <option value="D">Mañana</option>
          <option value="M">Mixto</option>
          <option value="N">Noche</option>
        </select>
      </div>

      <div *ngIf="tipo === 'Conductor'" class="input-group">
        <label>Placa del Vehículo</label>
        <input type="text" [(ngModel)]="modelo.placaVehiculo" name="placa">
      </div>

      <div *ngIf="tipo === 'Manipulador'" class="input-group">
        <label>Tipo de Manipulador</label>
        <select class="combo-box" [(ngModel)]="modelo.tipoManipulador" name="manip">
          <option value="" disabled>Seleccione un tipo</option>
          <option value="PAQUETES_ALIMENTICIOS">Paquetes Alimenticios</option>
          <option value="PAQUETES_NO_ALIMENTICIOS">Paquetes No Alimenticios</option>
          <option value="CARTAS">Cartas</option>
        </select>
      </div>

      <div class="button-group">
        <button type="button" class="btn-regresar" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn-finalizar" [disabled]="cargando">
          {{ cargando ? 'Guardando...' : 'Guardar Cambios' }}
        </button>
      </div>
    </form>

  </div>
</div>
