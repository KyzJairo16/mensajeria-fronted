<div class="container">

  <div class="card">

    <!-- HEADER -->
    <div class="card-header">
      <h2>Actualizar {{ categoria | titlecase }}</h2>
      <p class="subtitle">
        Tipo: <strong>{{ tipo }}</strong> | ID: <strong>{{ id }}</strong>
      </p>
    </div>

    <!-- FORMULARIO -->
    <form class="form">

      <!-- NOMBRE -->
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" placeholder="Ingrese el nombre" />
      </div>

      <!-- CEDULA -->
      <div class="form-group">
        <label>Cédula</label>
        <input type="text" placeholder="Ingrese la cédula" />
      </div>

      <!-- CORREO -->
      <div class="form-group">
        <label>Correo</label>
        <input type="email" placeholder="Ingrese el correo" />
      </div>

      <!-- TELEFONO -->
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" placeholder="Ingrese el teléfono" />
      </div>

      <!-- TURNO -->
      <div class="form-group">
        <label>Turno</label>
        <select>
          <option value="">Seleccione</option>
          <option value="M">Mañana</option>
          <option value="T">Tarde</option>
          <option value="N">Noche</option>
        </select>
      </div>

      <!-- CAMPOS DINÁMICOS -->
      <div *ngIf="tipo === 'Conductor'" class="form-group">
        <label>Placa Vehículo</label>
        <input type="text" placeholder="Ingrese la placa" />
      </div>

      <div *ngIf="tipo === 'Manipulador'" class="form-group">
        <label>Tipo de Manipulador</label>
        <input type="text" placeholder="Ej: Carga, Logística" />
      </div>

      <div *ngIf="categoria === 'administrador'" class="form-group">
        <label>Usuario</label>
        <input type="text" placeholder="Ingrese usuario" />
      </div>

      <div *ngIf="categoria === 'administrador'" class="form-group">
        <label>Contraseña</label>
        <input type="password" placeholder="Ingrese contraseña" />
      </div>

      <!-- BOTONES -->
      <div class="actions">
        <button type="button" class="btn cancel">
          Cancelar
        </button>

        <button type="submit" class="btn primary">
          <i class="fas fa-sync-alt"></i> Actualizar
        </button>
      </div>

    </form>

  </div>

</div>
