<div class="card">
  <h2>Actualizar Cliente {{tipo}}</h2>
  <form (ngSubmit)="guardar()">
    <label>Nombre</label>
    <input type="text" [(ngModel)]="modelo.nombre" name="nombre">
    <label>Cédula</label>
    <input type="text" [(ngModel)]="modelo.cedula" name="cedula">
    <label>Correo</label>
    <input type="email" [(ngModel)]="modelo.correo" name="correo">
    <label>Método de Pago</label>
    <select [(ngModel)]="modelo.metodoPago" name="metodo">
      <option value="Efectivo">Efectivo</option>
      <option value="Tarjeta">Tarjeta</option>
    </select>
    <button class="btn-edit"
            [routerLink]="['/admin/actualizarcliente', tipo, id]">
      <i class="fas fa-edit"></i> Actualizar
    </button>
    <button type="button" (click)="finalizar()">Cancelar</button>
    <button type="submit" [disabled]="cargando">Guardar</button>
  </form>
</div>
